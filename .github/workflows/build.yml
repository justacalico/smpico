name: Build and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      build_all:
        description: 'Build all targets (linux, linux-arm64, windows, windows-arm64, macos, macos-x64)'
        type: boolean
        default: true
      create_release:
        description: 'Create a versioned release from this build'
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

env:
  FLUTTER_VERSION: "3.47.7"

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  setup:
    name: Setup build metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      build_number: ${{ steps.meta.outputs.build_number }}
      build_date: ${{ steps.meta.outputs.build_date }}
      build_all: ${{ steps.meta.outputs.build_all }}
      targets: ${{ steps.meta.outputs.targets }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Read version and build metadata
        id: meta
        run: |
          VERSION=$(sed -n 's/^version: \([0-9][0-9.]*\).*/\1/p' pubspec.yaml | head -1)
          BUILD_NUMBER=$(date +%s | cut -c4-10)
          BUILD_DATE=$(date +%Y-%m-%d)
          if [ -n "${{ inputs.build_all }}" ]; then
            BUILD_ALL="${{ inputs.build_all }}"
          else
            BUILD_ALL="true"
          fi
          if [ "$BUILD_ALL" = "true" ]; then
            TARGETS='[{"target":"linux","os":"ubuntu-latest"},{"target":"linux-arm64","os":"ubuntu-24.04-arm","flutter":"git"},{"target":"windows","os":"windows-latest"},{"target":"windows-arm64","os":"windows-11-arm","flutter":"git"},{"target":"macos","os":"macos-latest","flutter_arch":"arm64"},{"target":"macos-x64","os":"macos-15-intel"}]'
          else
            TARGETS='[{"target":"linux","os":"ubuntu-latest"}]'
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "build_date=$BUILD_DATE" >> "$GITHUB_OUTPUT"
          echo "build_all=$BUILD_ALL" >> "$GITHUB_OUTPUT"
          echo "targets=$TARGETS" >> "$GITHUB_OUTPUT"

  verify:
    name: Verify app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Analyze
        run: |
          flutter config --no-analytics >/dev/null
          flutter pub get
          # The codebase carries info-level lints; fail on warnings/errors only.
          flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings

  build:
    name: Build ${{ matrix.target }}
    needs: [setup, verify]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.targets) }}
    env:
      VERSION: ${{ needs.setup.outputs.version }}
      BUILD_NUMBER: ${{ needs.setup.outputs.build_number }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Install Flutter
        if: matrix.flutter != 'git'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: ${{ matrix.flutter_arch || 'x64' }}
          cache: true

      - name: Install Flutter from source (arm64)
        if: matrix.flutter == 'git'
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "${{ env.FLUTTER_VERSION }}" https://github.com/flutter/flutter.git "$HOME/flutter-sdk"
          echo "$HOME/flutter-sdk/bin" >> "$GITHUB_PATH"
          if [ "${{ matrix.target }}" = "linux-arm64" ]; then
            "$HOME/flutter-sdk/bin/flutter" precache --linux
          else
            "$HOME/flutter-sdk/bin/flutter" precache --windows
          fi

      - name: Install Linux build dependencies
        if: startsWith(matrix.target, 'linux')
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang cmake ninja-build pkg-config libgtk-3-dev libblkid-dev liblzma-dev zip

      - name: Build Linux package
        if: startsWith(matrix.target, 'linux')
        run: |
          set -euo pipefail
          ARTIFACTS_DIR="$GITHUB_WORKSPACE/artifacts"
          mkdir -p "$ARTIFACTS_DIR"
          flutter config --no-analytics >/dev/null
          flutter pub get
          flutter config --enable-linux-desktop
          flutter build linux --release --build-name="$VERSION" --build-number="$BUILD_NUMBER"
          if [ "${{ matrix.target }}" = "linux-arm64" ]; then
            LINUX_ARCH=arm64
            OUT_ARCH=arm64
          else
            LINUX_ARCH=x64
            OUT_ARCH=x86_64
          fi
          BUNDLE="build/linux/$LINUX_ARCH/release/bundle"
          if [ ! -d "$BUNDLE" ]; then
            echo "Expected Linux build output at $BUNDLE is missing" >&2
            exit 1
          fi
          tar -czf "$ARTIFACTS_DIR/smpico-linux-$OUT_ARCH.tar.gz" -C "$BUNDLE" .
          (cd "$BUNDLE" && zip -r "$ARTIFACTS_DIR/smpico-linux-$OUT_ARCH.zip" . >/dev/null)

      - name: Build Windows package
        if: startsWith(matrix.target, 'windows')
        shell: bash
        run: |
          set -euo pipefail
          ARTIFACTS_DIR="$GITHUB_WORKSPACE/artifacts"
          mkdir -p "$ARTIFACTS_DIR"
          flutter config --no-analytics >/dev/null
          flutter pub get
          flutter config --enable-windows-desktop
          flutter build windows --release --build-name="$VERSION" --build-number="$BUILD_NUMBER"
          if [ "${{ matrix.target }}" = "windows-arm64" ]; then
            WIN_ARCH=arm64
            OUT_ARCH=arm64
          else
            WIN_ARCH=x64
            OUT_ARCH=x86_64
          fi
          RELEASE_DIR="build/windows/$WIN_ARCH/runner/Release"
          if [ ! -d "$RELEASE_DIR" ]; then
            echo "Expected Windows build output at $RELEASE_DIR is missing" >&2
            exit 1
          fi
          powershell -NoProfile -Command \
            "Compress-Archive -Path '$(cygpath -w "$RELEASE_DIR")\\*' -DestinationPath '$(cygpath -w "$ARTIFACTS_DIR/smpico-windows-$OUT_ARCH.zip")' -Force"

      - name: Build macOS package
        if: startsWith(matrix.target, 'macos')
        run: |
          set -euo pipefail
          ARTIFACTS_DIR="$GITHUB_WORKSPACE/artifacts"
          mkdir -p "$ARTIFACTS_DIR"
          flutter config --no-analytics >/dev/null
          flutter pub get
          flutter config --enable-macos-desktop
          flutter build macos --release --build-name="$VERSION" --build-number="$BUILD_NUMBER"
          APP="build/macos/Build/Products/Release/smpico.app"
          if [ ! -d "$APP" ]; then
            echo "Expected macOS build output at $APP is missing" >&2
            exit 1
          fi
          # Re-sign ad-hoc after packaging so the bundle stays runnable.
          codesign --force --deep --sign - "$APP"
          if [ "${{ matrix.target }}" = "macos-x64" ]; then
            OUT_ARCH=x86_64
          else
            OUT_ARCH=arm64
          fi
          (cd "$(dirname "$APP")" && zip -r "$ARTIFACTS_DIR/smpico-macos-$OUT_ARCH.zip" "smpico.app" >/dev/null)
          hdiutil create -volname "SMPico" -srcfolder "$APP" -ov -format UDZO "$ARTIFACTS_DIR/smpico-macos-$OUT_ARCH.dmg" >/dev/null

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: artifacts/*
          if-no-files-found: error

  nightly:
    name: Nightly release
    runs-on: ubuntu-latest
    needs: [setup, build]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.setup.outputs.build_all == 'true' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.create_release == false || inputs.create_release == 'false'))) }}
    permissions:
      contents: write
    concurrency:
      group: release-ops
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Move nightly tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch --tags --force
          git tag -f nightly "$GITHUB_SHA"
          git push -f origin nightly

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          set -euo pipefail
          mkdir -p release-assets
          find artifacts -type f -name 'smpico*' -exec cp {} release-assets/ \;
          ls -la release-assets/

      - name: Generate checksums
        working-directory: release-assets
        run: sha256sum * > ../SHA256SUMS.txt && cat ../SHA256SUMS.txt

      - name: Delete existing nightly assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view nightly -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release view nightly -R "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' 2>/dev/null | while read -r asset; do
              [ -n "$asset" ] && gh release delete-asset nightly -R "$GITHUB_REPOSITORY" "$asset" --yes 2>/dev/null || true
            done
          fi

      - name: Update nightly release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: Nightly Build
          body: |
            Automated nightly build from commit ${{ github.sha }}

            **Branch:** ${{ github.ref_name }}
            **Version:** ${{ needs.setup.outputs.version }}
            **Build:** #${{ github.run_number }}
            **Date:** ${{ needs.setup.outputs.build_date }}
            **Commit:** ${{ github.sha }}

            > This release is automatically updated on every push. Artifacts are untested nightly builds.
          prerelease: true
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Assets upload one at a time with retries so one dropped connection
      # does not fail the whole release.
      - name: Upload nightly assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for file in release-assets/* SHA256SUMS.txt; do
            uploaded=false
            for attempt in 1 2 3 4 5; do
              if gh release upload nightly -R "$GITHUB_REPOSITORY" "$file" --clobber; then
                uploaded=true
                break
              fi
              if [ "$attempt" -lt 5 ]; then
                echo "Upload of $file failed (attempt $attempt), retrying in $((attempt * 15))s" >&2
                sleep $((attempt * 15))
              fi
            done
            if [ "$uploaded" != true ]; then
              echo "Failed to upload $file after 5 attempts" >&2
              exit 1
            fi
          done

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [setup, build]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.setup.outputs.build_all == 'true' && ((github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && (inputs.create_release == true || inputs.create_release == 'true')) || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))) }}
    permissions:
      contents: write
    concurrency:
      group: release-ops
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Determine release tag
        id: meta
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "release_tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "release_tag=v${{ needs.setup.outputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create version tag
        if: github.event_name == 'workflow_dispatch' && (inputs.create_release == true || inputs.create_release == 'true')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch --tags --force
          TAG="${{ steps.meta.outputs.release_tag }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            if [ "$(git rev-parse "$TAG")" != "$GITHUB_SHA" ]; then
              echo "Tag $TAG exists on a different commit" >&2
              exit 1
            fi
          else
            git tag "$TAG" "$GITHUB_SHA"
            git push origin "$TAG"
          fi

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          set -euo pipefail
          mkdir -p release-assets
          find artifacts -type f -name 'smpico*' -exec cp {} release-assets/ \;
          TAG="${{ steps.meta.outputs.release_tag }}"
          git archive --format=tar.gz --prefix="smpico-${TAG#v}/" \
            -o "release-assets/smpico-${TAG}-source.tar.gz" "$TAG"
          ls -la release-assets/

      - name: Generate checksums
        working-directory: release-assets
        run: sha256sum * > ../SHA256SUMS.txt && cat ../SHA256SUMS.txt

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.release_tag }}
          name: SMPico ${{ steps.meta.outputs.release_tag }}
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.meta.outputs.release_tag }}
        run: |
          set -euo pipefail
          for file in release-assets/* SHA256SUMS.txt; do
            uploaded=false
            for attempt in 1 2 3 4 5; do
              if gh release upload "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" "$file" --clobber; then
                uploaded=true
                break
              fi
              if [ "$attempt" -lt 5 ]; then
                echo "Upload of $file failed (attempt $attempt), retrying in $((attempt * 15))s" >&2
                sleep $((attempt * 15))
              fi
            done
            if [ "$uploaded" != true ]; then
              echo "Failed to upload $file after 5 attempts" >&2
              exit 1
            fi
          done
